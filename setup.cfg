[flake8]
# El guion bajo `_` es la función de traducción gettext, inyectada en builtins al
# arrancar (app/core/i18n.py). Sin declararla aquí, el análisis estático produce
# miles de falsos positivos "undefined name '_'" que entierran los errores reales
# (así se colaron los NameError de la auditoría de julio de 2026).
builtins = _

# Solo los errores que delatan BUGS reales (nombres sin definir, sintaxis,
# comparaciones rotas...). El estilo (líneas largas, espacios) no se vigila aquí.
select = F821,F822,F823,E999,F811,F401,F841

# F401/F841 (imports y variables sin uso) se limpian por lotes pequeños; mientras
# tanto no deben tapar los F821. Para revisarlos: flake8 --select=F401,F841
extend-ignore =

exclude =
    .venv,
    build,
    adjuntos,
    nvda_addon,
    data
per-file-ignores =
    # Los mixins re-exportan nombres a propósito.
    app/ui/__init__.py:F401
    app/services/*/__init__.py:F401
    app/core/__init__.py:F401
