name = socialRSSListViewFix
summary = "SocialRSS: lectura completa de listas"
description = """Amplía el límite de NVDA al leer listas (SysListView32). Permite leer el contenido completo de cada columna al navegar con las flechas arriba y abajo, no solo los primeros 511 caracteres. Pensado para SocialRSS Accessible Suite, pero funciona en cualquier aplicación con listas. Se puede desactivar en cualquier momento desde el administrador de complementos de NVDA."""
author = "SocialRSS Accessible Suite"
url = https://xebolax.synology.me
version = 1.0.10
minimumNVDAVersion = 2023.1.0
lastTestedNVDAVersion = 2026.1.0
