[pytest]
# Limitar el descubrimiento de pruebas a tests/ del proyecto. Sin esto, pytest recorre todo el
# arbol (incluido adjuntos/, con repos externos) y recoge cientos de pruebas ajenas que fallan.
testpaths = tests
norecursedirs = .venv adjuntos BACKUP build data __pip__ nvda_addon dist .pytest_cache
python_files = test_*.py
